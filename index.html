<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Production — автоматизация смет</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f172a;
    color: #e0e7ff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .container { padding: 40px 20px; }
  img { width: 280px; height: 280px; }
  h1 { font-size: 36px; margin: 20px 0 8px; letter-spacing: 4px; }
  p { font-size: 16px; color: #a78bfa; margin: 6px 0; letter-spacing: 1px; }
  .small { font-size: 11px; color: #6366f1; letter-spacing: 2px; margin-top: 30px; }
  .status { margin-top: 30px; padding: 12px 24px; border: 1px solid #6366f1; border-radius: 8px; display: inline-block; color: #c4b5fd; font-size: 13px; }
</style>
</head>
<body>
  <div class="container">
    <img src="logo/aura-logo.svg" alt="Aura Production">
    <h1>AURA</h1>
    <p>PRODUCTION</p>
    <div class="status">Сайт в разработке · Скоро</div>
    <p class="small">SERGIJUS INCORPORATED</p>
  </div>
</body>
</html>
